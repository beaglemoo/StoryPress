name: macOS build and tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build and test
        run: xcodebuild test -project StoryPress.xcodeproj -scheme StoryPress -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO
